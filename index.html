    // JSONP 로더 함수 (CORS 전면 무료패스!)
    const loadJSONP = (ssId, gid, callbackName) => {
      return new Promise((resolve, reject) => {
        window[callbackName] = (jsonData) => {
          resolve(jsonData);
          delete window[callbackName];
          document.getElementById(callbackName)?.remove();
        };
        
        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `https://docs.google.com/spreadsheets/d/${ssId}/gviz/tq?tqx=responseHandler:${callbackName}&gid=${gid}`;
        script.onerror = (err) => {
          reject(err);
        };
        document.head.appendChild(script);
      });
    };

    function parseGvizUsers(gvizData) {
      if (!gvizData || !gvizData.table || !gvizData.table.rows) return [];
      const rows = gvizData.table.rows;
      const players = [];
      rows.forEach(row => {
        const c = row.c;
        if (!c || c.length < 2) return;
        const gameId = c[1] ? String(c[1].v || '').trim() : '';
        if (!gameId) return;
        
        const afreecaId = c[0] ? String(c[0].v || '').trim() : '';
        const notes = c[12] ? String(c[12].v || '').trim() : '';
        
        const positions = [];
        for (let p = 0; p < 5; p++) {
          const lineIdx = 2 + (p * 2);
          const tierIdx = 3 + (p * 2);
          const lineVal = c[lineIdx] ? String(c[lineIdx].v || '').trim() : '';
          const tierVal = c[tierIdx] ? String(c[tierIdx].v || '').trim() : '';
          if (lineVal && tierVal) {
            positions.push({ line: lineVal, tier: tierVal });
          }
        }
        
        players.push({
          afreecaId,
          gameId,
          positions,
          notes
        });
      });
      return players;
    }

    function parseGvizTp(gvizData) {
      if (!gvizData || !gvizData.table || !gvizData.table.rows) return {};
      const rows = gvizData.table.rows;
      const tpRules = {};
      rows.forEach(row => {
        const c = row.c;
        if (!c || c.length < 6) return;
        const tierKey = c[0] ? String(c[0].v || '').trim() : '';
        if (!tierKey) return;
        
        tpRules[tierKey] = {
          '탑': c[1] ? Number(c[1].v || 0) : 0,
          '정글': c[2] ? Number(c[2].v || 0) : 0,
          '미드': c[3] ? Number(c[3].v || 0) : 0,
          '원딜': c[4] ? Number(c[4].v || 0) : 0,
          '서폿': c[5] ? Number(c[5].v || 0) : 0
        };
      });
      return tpRules;
    }

    function parseGvizGames(gvizData) {
      if (!gvizData || !gvizData.table || !gvizData.table.rows) return [];
      const rows = gvizData.table.rows;
      const matches = [];
      // DB(game)의 앞의 2행은 서브헤더 및 가이드 행이므로 스킵하고 인덱스 2부터 파싱합니다!
      for (let i = 2; i < rows.length; i++) {
        const c = rows[i].c;
        if (!c) continue;
        const winner = c[0] ? String(c[0].v || '').trim() : '';
        if (!winner) continue;
        
        const matchRow = [];
        for (let col = 0; col < 22; col++) {
          const val = (c[col] && c[col].v !== null) ? String(c[col].v).trim() : '';
          matchRow.push(val);
        }
        matches.push(matchRow);
      }
      return matches;
    }

    function parseGameDate(dateStr) {
      if (!dateStr) return new Date(0);
      const match = dateStr.match(/(\d+)년\s*(\d+)월\s*(\d+)일\s*(\d+)시\s*(\d+)분/);
      if (match) {
        const yy = parseInt(match[1]);
        const mm = parseInt(match[2]) - 1;
        const dd = parseInt(match[3]);
        const hh = parseInt(match[4]);
        const min = parseInt(match[5]);
        return new Date(2000 + yy, mm, dd, hh, min);
      }
      return new Date(0);
    }

    function formatDateString(dateStr) {
      if (!dateStr) return '';
      const match = dateStr.match(/(\d+)년\s*(\d+)월\s*(\d+)일\s*(\d+)시\s*(\d+)분/);
      if (match) {
        return `20${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')} ${match[4].padStart(2, '0')}:${match[5].padStart(2, '0')}`;
      }
      return dateStr;
    }

    function App() {
      const getFormattedDate = (d) => {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const todayObj = new Date();
      const oneWeekAgoObj = new Date();
      oneWeekAgoObj.setDate(todayObj.getDate() - 7);

      const defaultEndDate = getFormattedDate(todayObj);
      const defaultStartDate = getFormattedDate(oneWeekAgoObj);

      const [data, setData] = useState(MOCK_DATA);
      const [loading, setLoading] = useState(false);
      
      const [searchName, setSearchName] = useState('리엘');
      const [startDate, setStartDate] = useState(defaultStartDate);
      const [endDate, setEndDate] = useState(defaultEndDate);
      const [showSuggestions, setShowSuggestions] = useState(false);

      const [appliedPlayer, setAppliedPlayer] = useState('리엘');
      const [appliedStartDate, setAppliedStartDate] = useState(defaultStartDate);
      const [appliedEndDate, setAppliedEndDate] = useState(defaultEndDate);

      useEffect(() => {
        loadAllDataLive();
      }, []);

      const loadAllDataLive = async () => {
        setLoading(true);
        try {
          const ssId = atob(OBFUSCATED_SS_ID);
          // JSONP로 DB(user)2, DB(tp), DB(game)를 한 번에 연동합니다!
          const [userData, tpData, gameData] = await Promise.all([
            loadJSONP(ssId, '1523995930', 'handleUserData'),
            loadJSONP(ssId, '1826658224', 'handleTpData'),
            loadJSONP(ssId, '1717495071', 'handleGameData')
          ]);

          const players = parseGvizUsers(userData);
          const tpRules = parseGvizTp(tpData);
          const matches = parseGvizGames(gameData);

          if (players.length > 0 && matches.length > 0) {
            setData({ players, tpRules, matches });
          }
        } catch (err) {
          console.error("JSONP Direct load failed, using fallback:", err);
          alert("구글 스프레드시트 실시간 동기화에 실패하여 내장된 샘플 데이터로 작동합니다.\n시트 공유 권한이 '링크가 있는 모든 사용자(뷰어)'인지 다시 확인해 주세요.");
        } finally {
          setLoading(false);
        }
      };

      const handleInquire = () => {
        const targetName = searchName.trim();
        if (!targetName) {
          alert('조회할 유저명을 입력해 주세요.');
          return;
        }
        setAppliedPlayer(targetName);
        setAppliedStartDate(startDate);
        setAppliedEndDate(endDate);
      };

      const allPlayerNames = useMemo(() => {
        const names = new Set(data.players.map(p => p.gameId));
        data.matches.forEach(row => {
          for (let i = 1; i <= 10; i++) {
            if (row[i]) names.add(row[i]);
          }
        });
        return Array.from(names).sort();
      }, [data]);

      const filteredSuggestions = useMemo(() => {
        if (!searchName) return [];
        return allPlayerNames.filter(name => 
          name.toLowerCase().includes(searchName.toLowerCase()) && name !== appliedPlayer
        ).slice(0, 10);
      }, [searchName, allPlayerNames, appliedPlayer]);

      // DB(user)2 정보 연동 기준 완벽 매핑
      const playerProfile = useMemo(() => {
        if (!appliedPlayer) return null;
        const user = data.players.find(p => p.gameId.toLowerCase() === appliedPlayer.toLowerCase());
        const positionsList = ['탑', '정글', '미드', '원딜', '서폿'];

        const positionEntries = positionsList.map(line => {
          if (!user) return { line, tier: '미등록', points: 0, isRegistered: false };
          
          const pos = user.positions.find(p => p.line === line);
          if (!pos) return { line, tier: '미등록', points: 0, isRegistered: false };
          
          const tierRule = data.tpRules[pos.tier];
          const points = tierRule ? Math.round(tierRule[line] || 0) : 0;
          
          return {
            line,
            tier: pos.tier,
            points: points,
            isRegistered: true
          };
        });

        return {
          gameId: user ? user.gameId : appliedPlayer,
          afreecaId: user ? user.afreecaId : '미등록',
          notes: user ? user.notes : 'DB(user)2 미등록 유저',
          positions: positionEntries
        };
      }, [appliedPlayer, data]);

      const isMatchInPeriod = (matchDateStr) => {
        const mDate = parseGameDate(matchDateStr);
        const start = new Date(appliedStartDate + 'T00:00:00');
        const end = new Date(appliedEndDate + 'T23:59:59');
        return mDate >= start && mDate <= end;
      };

      const parsedMatches = useMemo(() => {
        return data.matches.map(row => {
          const winner = row[0];
          const dateStr = row[21];
          const bluePlayers = [row[1], row[2], row[3], row[4], row[5]];
          const redPlayers = [row[6], row[7], row[8], row[9], row[10]];
          const blueChamps = [row[11], row[12], row[13], row[14], row[15]];
          const redChamps = [row[16], row[17], row[18], row[19], row[20]];
          
          return {
            winner,
            blue: { players: bluePlayers, champs: blueChamps },
            red: { players: redPlayers, champs: redChamps },
            dateStr,
            dateObj: parseGameDate(dateStr)
          };
        }).filter(m => isMatchInPeriod(m.dateStr));
      }, [data, appliedStartDate, appliedEndDate]);

      const positionsList = ['탑', '정글', '미드', '원딜', '서폿'];

      const stats = useMemo(() => {
        const initSideStats = () => positionsList.map(pos => ({ pos, win: 0, loss: 0 }));
        const res = {
          all: initSideStats(),
          blue: initSideStats(),
          red: initSideStats()
        };

        if (!appliedPlayer) return res;

        parsedMatches.forEach(m => {
          const bIdx = m.blue.players.findIndex(p => p.toLowerCase() === appliedPlayer.toLowerCase());
          if (bIdx !== -1) {
            const isWin = m.winner === 'B';
            if (isWin) res.all[bIdx].win++;
            else res.all[bIdx].loss++;
            if (isWin) res.blue[bIdx].win++;
            else res.blue[bIdx].loss++;
          }

          const rIdx = m.red.players.findIndex(p => p.toLowerCase() === appliedPlayer.toLowerCase());
          if (rIdx !== -1) {
            const isWin = m.winner === 'R';
            if (isWin) res.all[rIdx].win++;
            else res.all[rIdx].loss++;
            if (isWin) res.red[rIdx].win++;
            else res.red[rIdx].loss++;
          }
        });

        return res;
      }, [parsedMatches, appliedPlayer]);

      const sumStats = useMemo(() => {
        const calcSum = (sideStats) => {
          return sideStats.reduce((acc, curr) => {
            acc.win += curr.win;
            acc.loss += curr.loss;
            return acc;
          }, { win: 0, loss: 0 });
        };
        return {
          all: calcSum(stats.all),
          blue: calcSum(stats.blue),
          red: calcSum(stats.red)
        };
      }, [stats]);

      const recentHeadToHead = useMemo(() => {
        const h2h = { '탑': [], '정글': [], '미드': [], '원딜': [], '서폿': [] };
        if (!appliedPlayer) return h2h;

        const sorted = [...parsedMatches].sort((a, b) => b.dateObj - a.dateObj);

        sorted.forEach(m => {
          const bIdx = m.blue.players.findIndex(p => p.toLowerCase() === appliedPlayer.toLowerCase());
          if (bIdx !== -1) {
            const pos = positionsList[bIdx];
            if (h2h[pos].length < 10) {
              h2h[pos].push({
                date: m.dateStr,
                myChamp: m.blue.champs[bIdx],
                opponentName: m.red.players[bIdx],
                opponentChamp: m.red.champs[bIdx],
                result: m.winner === 'B' ? '승' : '패'
              });
            }
          }

          const rIdx = m.red.players.findIndex(p => p.toLowerCase() === appliedPlayer.toLowerCase());
          if (rIdx !== -1) {
            const pos = positionsList[rIdx];
            if (h2h[pos].length < 10) {
              h2h[pos].push({
                date: m.dateStr,
                myChamp: m.red.champs[rIdx],
                opponentName: m.blue.players[rIdx],
                opponentChamp: m.blue.champs[rIdx],
                result: m.winner === 'R' ? '승' : '패'
              });
            }
          }
        });

        return h2h;
      }, [parsedMatches, appliedPlayer]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-cyan-500 selection:text-white">
          <header className="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-gradient-to-tr from-cyan-500 to-indigo-600 p-2 rounded-lg shadow-lg">
                  <LayersIcon />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                    LeeeL.GG 티어 조정 위원회
                  </h1>
                  <p className="text-xs text-slate-400">딱 걸렸어. 넌 올라가라 이자시가</p>
                </div>
              </div>
              
              <div className="flex items-center space-x-3">
                <button
                  onClick={loadAllDataLive}
                  className="flex items-center space-x-2 px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition duration-200 text-sm font-medium"
                >
                  {loading ? <RefreshIcon /> : (
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-cyan-400"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                  )}
                  <span>실시간 동기화</span>
                </button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">
            
            <section className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative z-30">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-end">
                <div className="lg:col-span-4 relative">
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                    <UserIcon />
                    <span>시참 유저명 선택</span>
                  </label>
                  <div className="relative">
                    <input
                      type="text"
                      value={searchName}
                      onChange={(e) => {
                        setSearchName(e.target.value);
                        setShowSuggestions(true);
                      }}
                      onFocus={() => setShowSuggestions(true)}
                      placeholder="닉네임 또는 게임 아이디 입력"
                      className="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl pl-11 pr-4 py-3 text-slate-100 placeholder-slate-500 transition duration-200 outline-none"
                    />
                    <div className="absolute left-4 top-3.5"><SearchIcon /></div>
                    
                    {appliedPlayer && (
                      <div className="absolute right-4 top-3 bg-slate-800 text-xs px-2.5 py-1.5 rounded text-slate-400">
                        현재 조회: <span className="text-cyan-400 font-bold text-xs">{appliedPlayer}</span>
                      </div>
                    )}
                  </div>

                  {showSuggestions && filteredSuggestions.length > 0 && (
                    <ul className="absolute left-0 right-0 mt-2 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-h-60 overflow-y-auto z-50 divide-y divide-slate-800">
                      {filteredSuggestions.map((name) => (
                        <li key={name}>
                          <button
                            type="button"
                            onClick={() => {
                              setSearchName(name);
                              setShowSuggestions(false);
                            }}
                            className="w-full text-left px-4 py-3 hover:bg-slate-800 transition duration-150 flex items-center justify-between text-sm"
                          >
                            <span className="font-semibold text-slate-200">{name}</span>
                            <span className="text-xs text-slate-500">선택</span>
                          </button>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>

                <div className="lg:col-span-5 grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                      <CalendarIcon />
                      <span>조회 시작일</span>
                    </label>
                    <input
                      type="date"
                      value={startDate}
                      onChange={(e) => setStartDate(e.target.value)}
                      className="w-full bg-slate-900 border-2 border-slate-700 hover:border-cyan-500 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-950 rounded-xl px-4 py-3 text-slate-100 font-bold transition duration-200 outline-none cursor-pointer shadow-lg shadow-black/30"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-2 flex items-center space-x-1.5">
                      <CalendarIcon />
                      <span>조회 종료일</span>
                    </label>
                    <input
                      type="date"
                      value={endDate}
                      onChange={(e) => setEndDate(e.target.value)}
                      className="w-full bg-slate-900 border-2 border-slate-700 hover:border-cyan-500 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-950 rounded-xl px-4 py-3 text-slate-100 font-bold transition duration-200 outline-none cursor-pointer shadow-lg shadow-black/30"
                    />
                  </div>
                </div>

                <div className="lg:col-span-3">
                  <button
                    onClick={handleInquire}
                    className="w-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-cyan-950/20 transition-all duration-200 flex items-center justify-center space-x-2"
                  >
                    <SearchIcon />
                    <span>조회하기 (업데이트)</span>
                  </button>
                </div>
              </div>
              
              {showSuggestions && (
                <div className="fixed inset-0 z-40 bg-transparent" onClick={() => setShowSuggestions(false)} />
              )}
            </section>

            {playerProfile && (
              <section className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div className="flex flex-col space-y-6">
                  <div className="flex items-center space-x-4">
                    <div className="h-14 w-14 rounded-full bg-gradient-to-tr from-cyan-500/20 to-indigo-500/20 border border-cyan-500/30 flex items-center justify-center">
                      <AwardIcon />
                    </div>
                    <div>
                      <div className="flex items-center space-x-3">
                        <h2 className="text-2xl font-bold text-slate-100">{playerProfile.gameId}</h2>
                      </div>
                      <p className="text-sm text-slate-400 mt-1">
                        {playerProfile.notes && playerProfile.notes !== '확인' && playerProfile.notes !== 'DB(user)2 미등록 유저' ? `비고: ${playerProfile.notes}` : '등록된 비고 사항이 없습니다.'}
                      </p>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                    {playerProfile.positions.map((pos, idx) => (
                      <div 
                        key={idx} 
                        className={`border rounded-xl p-4 flex flex-col justify-between h-[120px] transition ${
                          pos.isRegistered 
                            ? 'bg-slate-950/60 border-slate-800 hover:border-cyan-500/30' 
                            : 'bg-slate-950/20 border-slate-900/50 opacity-50'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className={`text-[11px] font-bold uppercase tracking-wider ${pos.isRegistered ? 'text-cyan-400' : 'text-slate-500'}`}>
                            {pos.line}
                          </span>
                          {pos.isRegistered && (
                            <CheckIcon />
                          )}
                        </div>
                        
                        <div className="mt-2">
                          <span className={`text-base font-bold block ${pos.isRegistered ? 'text-slate-100' : 'text-slate-600'}`}>
                            {pos.tier}
                          </span>
                        </div>

                        <div className="mt-2">
                          {pos.isRegistered ? (
                            <div className="inline-flex items-center justify-center bg-cyan-950/40 text-cyan-400 border border-cyan-500/10 rounded-md px-2.5 py-0.5 text-xs font-extrabold">
                              {pos.points} TP
                            </div>
                          ) : (
                            <span className="text-[10px] text-slate-700 font-medium">점수 미보유</span>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            )}

            <section className="space-y-4">
              <div className="flex items-center justify-between">
                <h3 className="text-lg font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-2">
                  <ShieldIcon />
                  <span>진영별 / 라인별 통계 (합계 포함)</span>
                </h3>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                  <div>
                    <h4 className="text-sm font-bold text-slate-200 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2 flex items-center justify-between">
                      <span>전체 진영 전적</span>
                      <span className="text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full px-2.5 py-0.5">ALL SIDES</span>
                    </h4>
                    <table className="w-full text-sm text-left">
                      <thead>
                        <tr className="text-xs font-semibold text-slate-500 border-b border-slate-800/50">
                          <th className="pb-2">라인</th>
                          <th className="pb-2 text-center">판수</th>
                          <th className="pb-2 text-center text-cyan-400">승</th>
                          <th className="pb-2 text-center text-rose-400">패</th>
                          <th className="pb-2 text-right">승률</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/30">
                        {stats.all.map((r, idx) => {
                          const total = r.win + r.loss;
                          const winRate = total > 0 ? Math.round((r.win / total) * 100) : 0;
                          return (
                            <tr key={idx} className="hover:bg-slate-800/10">
                              <td className="py-2.5 font-medium text-slate-300">{r.pos}</td>
                              <td className="py-2.5 text-center text-slate-400">{total}</td>
                              <td className="py-2.5 text-center font-bold text-cyan-400/80">{r.win}</td>
                              <td className="py-2.5 text-center font-bold text-rose-400/80">{r.loss}</td>
                              <td className={`py-2.5 text-right font-semibold ${total > 0 ? 'text-slate-200' : 'text-slate-600'}`}>
                                {total > 0 ? `${winRate}%` : '-'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  <div className="mt-4 pt-3 border-t border-slate-800 bg-slate-950/40 rounded-xl px-4 py-2.5 flex items-center justify-between text-sm font-bold">
                    <span className="text-slate-400 uppercase tracking-wider text-xs">SUM 전체 합계</span>
                    <div className="flex items-center space-x-6 text-slate-300">
                      <span>{sumStats.all.win + sumStats.all.loss}전</span>
                      <span className="text-cyan-400">{sumStats.all.win}승</span>
                      <span className="text-rose-400">{sumStats.all.loss}패</span>
                      <span className="bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                        {sumStats.all.win + sumStats.all.loss > 0 
                          ? `${Math.round((sumStats.all.win / (sumStats.all.win + sumStats.all.loss)) * 100)}%` 
                          : '-'}
                      </span>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                  <div>
                    <h4 className="text-sm font-bold text-slate-200 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2 flex items-center justify-between">
                      <span>블루 진영 전적</span>
                      <span className="text-[10px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded-full px-2.5 py-0.5">BLUE SIDE</span>
                    </h4>
                    <table className="w-full text-sm text-left">
                      <thead>
                        <tr className="text-xs font-semibold text-slate-500 border-b border-slate-800/50">
                          <th className="pb-2">라인</th>
                          <th className="pb-2 text-center">판수</th>
                          <th className="pb-2 text-center text-cyan-400">승</th>
                          <th className="pb-2 text-center text-rose-400">패</th>
                          <th className="pb-2 text-right">승률</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/30">
                        {stats.blue.map((r, idx) => {
                          const total = r.win + r.loss;
                          const winRate = total > 0 ? Math.round((r.win / total) * 100) : 0;
                          return (
                            <tr key={idx} className="hover:bg-slate-800/10">
                              <td className="py-2.5 font-medium text-slate-300">{r.pos}</td>
                              <td className="py-2.5 text-center text-slate-400">{total}</td>
                              <td className="py-2.5 text-center font-bold text-cyan-400/80">{r.win}</td>
                              <td className="py-2.5 text-center font-bold text-rose-400/80">{r.loss}</td>
                              <td className={`py-2.5 text-right font-semibold ${total > 0 ? 'text-slate-200' : 'text-slate-600'}`}>
                                {total > 0 ? `${winRate}%` : '-'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  <div className="mt-4 pt-3 border-t border-slate-800 bg-slate-950/40 rounded-xl px-4 py-2.5 flex items-center justify-between text-sm font-bold">
                    <span className="text-slate-400 uppercase tracking-wider text-xs">SUM 블루 합계</span>
                    <div className="flex items-center space-x-6 text-slate-300">
                      <span>{sumStats.blue.win + sumStats.blue.loss}전</span>
                      <span className="text-cyan-400">{sumStats.blue.win}승</span>
                      <span className="text-rose-400">{sumStats.blue.loss}패</span>
                      <span className="text-cyan-400">
                        {sumStats.blue.win + sumStats.blue.loss > 0 
                          ? `${Math.round((sumStats.blue.win / (sumStats.blue.win + sumStats.blue.loss)) * 100)}%` 
                          : '-'}
                      </span>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                  <div>
                    <h4 className="text-sm font-bold text-slate-200 uppercase tracking-wider mb-4 border-b border-slate-800 pb-2 flex items-center justify-between">
                      <span>레드 진영 전적</span>
                      <span className="text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-full px-2.5 py-0.5">RED SIDE</span>
                    </h4>
                    <table className="w-full text-sm text-left">
                      <thead>
                        <tr className="text-xs font-semibold text-slate-500 border-b border-slate-800/50">
                          <th className="pb-2">라인</th>
                          <th className="pb-2 text-center">판수</th>
                          <th className="pb-2 text-center text-cyan-400">승</th>
                          <th className="pb-2 text-center text-rose-400">패</th>
                          <th className="pb-2 text-right">승률</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/30">
                        {stats.red.map((r, idx) => {
                          const total = r.win + r.loss;
                          const winRate = total > 0 ? Math.round((r.win / total) * 100) : 0;
                          return (
                            <tr key={idx} className="hover:bg-slate-800/10">
                              <td className="py-2.5 font-medium text-slate-300">{r.pos}</td>
                              <td className="py-2.5 text-center text-slate-400">{total}</td>
                              <td className="py-2.5 text-center font-bold text-cyan-400/80">{r.win}</td>
                              <td className="py-2.5 text-center font-bold text-rose-400/80">{r.loss}</td>
                              <td className={`py-2.5 text-right font-semibold ${total > 0 ? 'text-slate-200' : 'text-slate-600'}`}>
                                {total > 0 ? `${winRate}%` : '-'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>

                  <div className="mt-4 pt-3 border-t border-slate-800 bg-slate-950/40 rounded-xl px-4 py-2.5 flex items-center justify-between text-sm font-bold">
                    <span className="text-slate-400 uppercase tracking-wider text-xs">SUM 레드 합계</span>
                    <div className="flex items-center space-x-6 text-slate-300">
                      <span>{sumStats.red.win + sumStats.red.loss}전</span>
                      <span className="text-cyan-400">{sumStats.red.win}승</span>
                      <span className="text-rose-400">{sumStats.red.loss}패</span>
                      <span className="text-rose-400">
                        {sumStats.red.win + sumStats.red.loss > 0 
                          ? `${Math.round((sumStats.red.win / (sumStats.red.win + sumStats.red.loss)) * 100)}%` 
                          : '-'}
                      </span>
                    </div>
                  </div>
                </div>

              </div>
            </section>

            <section className="space-y-4">
              <h3 className="text-lg font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-2">
                <AwardIcon />
                <span>포지션별 최근 10경기 맞라인 상대 라이벌 전적</span>
              </h3>

              <div className="space-y-6">
                {positionsList.map((pos) => {
                  const matchesList = recentHeadToHead[pos];
                  if (matchesList.length === 0) return null;

                  return (
                    <div key={pos} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                      <div className="px-6 py-4 bg-slate-900/60 border-b border-slate-800 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                          <span className="px-3 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-xs font-bold rounded-lg uppercase tracking-wide">
                            {pos}
                          </span>
                          <span className="text-sm font-bold text-slate-200">{pos} 포지션 맞대결 로그</span>
                        </div>
                        <span className="text-xs text-slate-500">최근 {matchesList.length}경기</span>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                          <thead>
                            <tr className="bg-slate-950/40 text-xs font-semibold text-slate-500 uppercase tracking-wider border-b border-slate-800">
                              <th className="py-3 px-6">경기 일시</th>
                              <th className="py-3 px-6">맞라인 상대 유저</th>
                              <th className="py-3 px-6">내 플레이 챔프</th>
                              <th className="py-3 px-6">상대 플레이 챔프</th>
                              <th className="py-3 px-6 text-center">결과</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/40">
                            {matchesList.map((match, idx) => (
                              <tr key={idx} className="hover:bg-slate-800/10 transition duration-150">
                                <td className="py-3.5 px-6 font-medium text-slate-400">{formatDateString(match.date)}</td>
                                <td className="py-3.5 px-6">
                                  <span className="font-semibold text-slate-200">{match.opponentName}</span>
                                </td>
                                <td className="py-3.5 px-6 text-slate-300">
                                  <span className="bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-md text-xs font-semibold">
                                    {match.myChamp}
                                  </span>
                                </td>
                                <td className="py-3.5 px-6 text-slate-400">
                                  <span className="bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-md text-xs">
                                    {match.opponentChamp}
                                  </span>
                                </td>
                                <td className="py-3.5 px-6 text-center">
                                  <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold ${
                                    match.result === '승' 
                                      ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' 
                                      : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                                  }`}>{match.result === '승' ? 'WIN 승리' : 'LOSS 패배'}</span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })}

                {Object.values(recentHeadToHead).every(list => list.length === 0) && (
                  <div className="bg-slate-900 border border-slate-850 rounded-2xl p-12 text-center text-slate-500 flex flex-col items-center justify-center space-y-2">
                    <InfoIcon />
                    <h4 className="text-base font-semibold text-slate-400">조회 범위 내 플레이한 맞라인 전적이 없습니다.</h4>
                  </div>
                )}
              </div>
            </section>

          </main>

          <footer className="border-t border-slate-900 bg-slate-950 py-6 mt-12 text-center text-xs text-slate-600">
            <p className="max-w-7xl mx-auto px-4">
              LoL 내전 전적 분석기 &copy; {new Date().getFullYear()} Antigravity. 구글 스프레드시트 실시간 연결 지원.
            </p>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

</body>
</html>
